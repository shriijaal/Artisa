{% extends "emails/base.html" %}
{% block content %}
<h2 style="margin:0 0 16px;color:#1c1917;font-size:20px;">Commission Cancelled</h2>
<p style="margin:0 0 12px;color:#44403c;font-size:15px;line-height:1.6;">
  Hi there, the commission "<strong>{{ commission.title }}</strong>" has been cancelled.
</p>
<table width="100%" cellpadding="0" cellspacing="0" style="margin:0 0 20px;">
  <tr><td style="background-color:#f5f5f4;border-left:4px solid #78716c;padding:16px;border-radius:0 8px 8px 0;">
    <p style="margin:0;font-size:14px;color:#78716c;font-weight:700;">Cancelled</p>
    <p style="margin:4px 0 0;font-size:13px;color:#a8a29e;">No further action is needed.</p>
  </td></tr>
</table>
{% endblock %}
