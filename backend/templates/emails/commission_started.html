{% extends "emails/base.html" %}
{% block content %}
<h2 style="margin:0 0 16px;color:#1c1917;font-size:20px;">Work Has Started</h2>
<p style="margin:0 0 12px;color:#44403c;font-size:15px;line-height:1.6;">
  Hi {{ commission.customer.username }}, <strong>{{ commission.artist.username }}</strong> has started working on your commission "<strong>{{ commission.title }}</strong>".
</p>
<table width="100%" cellpadding="0" cellspacing="0" style="margin:0 0 20px;">
  <tr><td style="background-color:#eff6ff;border-left:4px solid #2563eb;padding:16px;border-radius:0 8px 8px 0;">
    <p style="margin:0;font-size:14px;color:#2563eb;font-weight:700;">In Progress</p>
    <p style="margin:4px 0 0;font-size:13px;color:#78716c;">You'll be notified when the artist delivers the work.</p>
  </td></tr>
</table>
{% endblock %}
