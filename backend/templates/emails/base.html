<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body style="margin:0;padding:0;background-color:#fafaf9;font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;">
<table width="100%" cellpadding="0" cellspacing="0" style="background-color:#fafaf9;padding:40px 20px;">
<tr><td align="center">
<table width="600" cellpadding="0" cellspacing="0" style="max-width:600px;width:100%;">
  <!-- Header -->
  <tr><td style="background-color:#d97706;padding:24px 32px;border-radius:12px 12px 0 0;">
    <h1 style="margin:0;color:#ffffff;font-size:24px;font-weight:700;">Artisa</h1>
    <p style="margin:4px 0 0;color:#fef3c7;font-size:13px;">Handcrafted by Nepali Artists</p>
  </td></tr>
  <!-- Body -->
  <tr><td style="background-color:#ffffff;padding:32px;border:1px solid #e7e5e4;border-top:none;">
    {% block content %}{% endblock %}
  </td></tr>
  <!-- Footer -->
  <tr><td style="background-color:#f5f5f4;padding:20px 32px;border-radius:0 0 12px 12px;border:1px solid #e7e5e4;border-top:none;">
    <p style="margin:0;font-size:12px;color:#78716c;text-align:center;">
      Artisa — Nepal's marketplace for artists and collectors.<br>
      You received this email because you have an account on Artisa.
    </p>
  </td></tr>
</table>
</td></tr>
</table>
</body>
</html>
